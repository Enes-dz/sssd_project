<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
</head>
<body>
  <!-- REQUEST RESET STEP -->
  <div class="card" id="step-request">
    <div class="brand">Reset password.</div>
    <p class="subtitle">We'll send a reset link to your email address.</p>

    <div id="request-error" class="alert alert-error" style="display:none;"></div>
    <div id="request-success" class="alert alert-success" style="display:none;"></div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
    </div>

    <button class="btn" onclick="handlePasswordReset()">Send reset email</button>
    <button class="btn btn-ghost" style="margin-top:0.5rem;" onclick="window.location.href='login.html'">Back to login</button>
  </div>

  <!-- CAPTCHA STEP (if triggered) -->
  <div class="card" id="step-captcha" style="display:none;">
    <div class="brand">Verify you're human.</div>
    <p class="subtitle">Too many reset attempts. Please complete the captcha.</p>
    <div id="captcha-error" class="alert alert-error" style="display:none;"></div>
    <div id="h-captcha-placeholder" style="margin:1.5rem 0; min-height:78px; background:var(--input-bg); border:1px solid var(--border); border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--text-secondary); font-size:0.85rem;">
      <div class="h-captcha" data-sitekey="73a4a120-2f1c-4176-a62c-0a00aec2b332"></div>
    </div>
    <button class="btn" onclick="submitResetCaptcha()">Continue</button>
    <button class="btn btn-ghost" style="margin-top:0.5rem;" onclick="showStep('request')">Back</button>
  </div>

  <!-- NEW PASSWORD STEP (arrived via link: ?token=...&email=...) -->
  <div class="card" id="step-new-password" style="display:none;">
    <div class="brand">New password.</div>
    <p class="subtitle">Choose a strong new password for your account.</p>

    <div id="reset-error" class="alert alert-error" style="display:none;"></div>
    <div id="reset-success" class="alert alert-success" style="display:none;"></div>

    <div class="field">
      <label for="new-password">New password</label>
      <input type="password" id="new-password" placeholder="••••••••" autocomplete="new-password" />
      <p class="hint">At least 8 characters with uppercase, lowercase, number &amp; special character.</p>
    </div>
    <div class="field">
      <label for="confirm-new-password">Confirm new password</label>
      <input type="password" id="confirm-new-password" placeholder="••••••••" autocomplete="new-password" />
    </div>

    <button class="btn" onclick="handlePasswordResetVerify()">Set new password</button>
  </div>

  <script src="js/forgot-password.js"></script>
</body>
</html>
