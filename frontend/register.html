<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <div class="card" style="max-width:460px;">
    <div class="brand">Create account.</div>
    <p class="subtitle">Fill in the details below to get started.</p>

    <div id="register-error" class="alert alert-error" style="display:none;"></div>
    <div id="register-success" class="alert alert-success" style="display:none;"></div>

    <div class="field">
      <label for="full-name">Full name</label>
      <input type="text" id="full-name" placeholder="Jane Doe" autocomplete="name" />
    </div>

    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="janedoe" autocomplete="username" />
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
    </div>

    <div class="field">
      <label for="phone-number">Phone number</label>
      <input type="tel" id="phone-number" placeholder="+1234567890" autocomplete="tel" />
      <p class="hint">Include country code, e.g. +1 555 000 0000</p>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="new-password" />
      <p class="hint">At least 8 characters with uppercase, lowercase, number &amp; special character.</p>
    </div>

    <div class="field">
      <label for="confirm-password">Confirm password</label>
      <input type="password" id="confirm-password" placeholder="••••••••" autocomplete="new-password" />
    </div>

    <div class="terms">
      <input type="checkbox" id="terms" />
      <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</label>
    </div>

    <button class="btn" id="register-btn" onclick="handleRegister()">Create account</button>

    <div class="divider">or</div>
    <p class="switch-link">Already have an account? <a href="login.html">Sign in</a></p>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
